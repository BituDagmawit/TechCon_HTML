<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule</title>
</head>
<body>

  <header>
    <h1>Event Schedule</h1>
  </header>

  <main>
    <section>
      <h2>Daily Schedule</h2>

      <table border="1">
        <thead>
          <tr>
            <th>Time</th>
            <th>Activity</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>9:00 AM</td>
            <td>Opening Ceremony</td>
          </tr>
          <tr>
            <td>11:00 AM</td>
            <td>Workshop</td>
          </tr>
          <tr>
            <td>2:00 PM</td>
            <td>Group Session</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

</body>
</html>
