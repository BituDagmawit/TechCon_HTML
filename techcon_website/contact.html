<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — TechCon 2024</title>
</head>
<body>

  <header>
    <h1>Contact Us</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="schedule.html">Schedule</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Contact Information</h2>
      <p>Email: <a href="mailto:email@example.com">email@example.com</a></p>
      <p>Follow us:</p>
      <ul>
        <li><a href="https://twitter.com/techcon" target="_blank" rel="noopener">Twitter</a></li>
        <li><a href="https://www.linkedin.com/company/techcon" target="_blank" rel="noopener">LinkedIn</a></li>
      </ul>
    </section>

    <section>
      <h2>Location</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!"
        width="600"
        height="450"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        title="TechCon Venue">
      </iframe>
    </section>

    <section>
      <h2>Send us a message</h2>
      <form action="#" method="post">
        <div>
          <label for="contact-name">Name:</label>
          <input type="text" id="contact-name" name="name" required>
        </div>

        <div>
          <label for="contact-email">Email:</label>
          <input type="email" id="contact-email" name="email" required>
        </div>

        <div>
          <label for="contact-message">Message:</label>
          <textarea id="contact-message" name="message" rows="5" required></textarea>
        </div>

        <div>
          <button type="submit">Send Message</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2024 TechCon Conference — copyright</p>
  </footer>

</body>
</html>
